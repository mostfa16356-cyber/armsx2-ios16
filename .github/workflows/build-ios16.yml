name: Build ARMSX2 for iPadOS 16.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out ARMSX2 source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          ref: 19c83bf065ed21a19d8c46a1f578e37d2dab8efd
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Apply iPadOS 16.3 compatibility patch
        run: |
          cat > /tmp/armsx2-ios16.patch <<'ARMSX2_IOS16_PATCH'
          diff --git a/.github/workflows/scripts/macos/build-dependencies-embedded.sh b/.github/workflows/scripts/macos/build-dependencies-embedded.sh
          index 95502bf..41d38a8 100755
          --- a/.github/workflows/scripts/macos/build-dependencies-embedded.sh
          +++ b/.github/workflows/scripts/macos/build-dependencies-embedded.sh
          @@ -54,10 +54,13 @@ fi
           
           # The build passes this in: the core's own job sets one deployment target and
           # hands it here, so the dependencies and the core are built against the same
          -# one. The default is for running this script by hand - 17.4 matches the iOS app
          -# in platforms/ios, and tvOS takes the same number, which is a real tvOS release
          -# too.
          -: ${APPLE_DEPLOYMENT_TARGET:=17.4}
          +# one. The default is for running this script by hand. Keep the tvOS default
          +# unchanged while matching the iOS app's minimum supported version.
          +if [ "$APPLE_PLATFORM" = ios ]; then
          +	: ${APPLE_DEPLOYMENT_TARGET:=16.3}
          +else
          +	: ${APPLE_DEPLOYMENT_TARGET:=17.4}
          +fi
           
           FREETYPE=2.14.3
           SDL=SDL3-3.4.12
          diff --git a/platforms/ios/app/src/main/cpp/CMakeLists.txt b/platforms/ios/app/src/main/cpp/CMakeLists.txt
          index 0ebf597..c2e33f1 100644
          --- a/platforms/ios/app/src/main/cpp/CMakeLists.txt
          +++ b/platforms/ios/app/src/main/cpp/CMakeLists.txt
          @@ -37,7 +37,7 @@ if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
           	endif()
           	option(ARMSX2_ENABLE_JIT_ENTITLEMENTS "Attach the Apple JIT entitlement file for provisioning profiles which allow it" ${ARMSX2_JIT_ENTITLEMENTS_DEFAULT})
           	option(ARMSX2_IOS_DSYM "Emit a .dSYM for crash symbolication (injects -g into Release; costs link time + artifact size)" OFF)
          -	set(ARMSX2_IOS_DEPLOYMENT_TARGET "17.4" CACHE STRING "Minimum iOS deployment target")
          +	set(ARMSX2_IOS_DEPLOYMENT_TARGET "16.3" CACHE STRING "Minimum iOS deployment target")
           	set(CMAKE_OSX_DEPLOYMENT_TARGET "${ARMSX2_IOS_DEPLOYMENT_TARGET}" CACHE STRING "Minimum iOS deployment target" FORCE)
           	set(ARMSX2_MACOS_DEPLOYMENT_TARGET "15.0" CACHE STRING "Minimum Mac Catalyst deployment target")
           	if(ARMSX2_REAL_DEVICE OR ARMSX2_MAC_CATALYST)
