          @@ -0,0 +1,81 @@
          +import SwiftUI
          +
          +// Keep newer presentation and scroll styling on supported systems while letting
          +// the same frontend run on iPadOS 16.3.
          +enum CompatContentMarginPlacement {
          +    case scrollContent
          +}
          +
          +extension View {
          +    // The two-value SwiftUI overload starts with iOS 17. Capturing the value in
          +    // the older overload preserves the previous value when the closure fires.
          +    func onChangeCompat<Value: Equatable>(
          +        of value: Value,
          +        perform action: @escaping (Value, Value) -> Void
          +    ) -> some View {
          +        onChange(of: value) { [value] newValue in
          +            action(value, newValue)
          +        }
          +    }
          +
          +    @ViewBuilder
          +    func compatContentMargins(
          +        _ edges: Edge.Set,
          +        _ length: CGFloat,
          +        for placement: CompatContentMarginPlacement
          +    ) -> some View {
          +        if #available(iOS 17.0, *) {
          +            contentMargins(edges, length, for: .scrollContent)
          +        } else if edges == .bottom {
          +            padding(.bottom, length)
          +        } else {
          +            self
          +        }
          +    }
          +
          +    @ViewBuilder
          +    func compatScrollBounceAlways(axes: Axis.Set = .vertical) -> some View {
          +        if #available(iOS 16.4, *) {
          +            scrollBounceBehavior(.always, axes: axes)
          +        } else {
          +            self
          +        }
          +    }
          +
          +    @ViewBuilder
          +    func compatPresentationBackground(_ color: Color) -> some View {
          +        if #available(iOS 16.4, *) {
          +            presentationBackground(color)
          +        } else {
          +            self
          +        }
          +    }
          +
          +    @ViewBuilder
          +    func compatPresentationCornerRadius(_ radius: CGFloat) -> some View {
          +        if #available(iOS 16.4, *) {
          +            presentationCornerRadius(radius)
          +        } else {
          +            self
          +        }
          +    }
          +
          +    @ViewBuilder
          +    func compatReplaceSymbolTransition() -> some View {
          +        if #available(iOS 17.0, *) {
          +            contentTransition(.symbolEffect(.replace))
          +        } else {
          +            self
          +        }
          +    }
          +
          +    @ViewBuilder
          +    func compatFavoriteSymbolEffect(value: Int) -> some View {
          +        if #available(iOS 17.0, *) {
          +            contentTransition(.symbolEffect)
          +                .symbolEffect(.bounce, value: value)
          +        } else {
          +            self
          +        }
          +    }
          +}
