          ARMSX2_IOS16_PATCH
          cd upstream
          git apply --check /tmp/armsx2-ios16.patch
          git apply /tmp/armsx2-ios16.patch

      - name: Build unsigned IPA
        run: |
          cd upstream
          bash platforms/ios/scripts/build-ios-ipa.sh

      - name: Verify minimum iOS version
        run: |
          APP=upstream/platforms/ios/build-ios-xcode/Release-iphoneos/ARMSX2iOS.app
          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          test "$ACTUAL" = "16.3"
          test -f upstream/platforms/ios/build-ios-xcode/ARMSX2-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-iPadOS-16.3-unsigned
          path: upstream/platforms/ios/build-ios-xcode/ARMSX2-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
